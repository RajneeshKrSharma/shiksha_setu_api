<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwriting reader test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #14161a; }
  h1 { font-size: 22px; }
  section { border: 1px solid #d9dde4; border-radius: 8px; padding: 14px 16px; margin: 14px 0; display: flex; flex-direction: column; gap: 10px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; }
  input, button { font: inherit; padding: 8px 10px; }
  button { cursor: pointer; width: fit-content; }
  pre { white-space: pre-wrap; background: #f3f5f9; padding: 12px; border-radius: 6px; font-family: "Noto Sans Devanagari", ui-monospace, monospace; line-height: 1.6; }
  .err { color: #a11; }
  .muted { color: #5d6470; font-size: 13px; }
</style>
</head>
<body>
<h1>Handwriting reader test</h1>
<p class="muted">No sign-in needed while testing. Pick photos or PDFs, and the text read from them is shown below.</p>

<section>
  <strong>Pick files (up to 6, JPG / PNG / WebP / PDF)</strong>
  <input id="files" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" multiple>
  <button id="read">Read handwriting</button>
  <span id="readStatus" class="muted"></span>
</section>

<div id="out"></div>

<script>
  var $ = function (id) { return document.getElementById(id); };

  function show(text, isError) {
    var el = $("readStatus");
    el.textContent = text;
    el.className = isError ? "err" : "muted";
  }

  async function message(res) {
    try { var body = await res.json(); return body.message || JSON.stringify(body); }
    catch (e) { return "Error " + res.status; }
  }

  function card(name) {
    var box = document.createElement("section");
    var title = document.createElement("strong"); title.textContent = name;
    var status = document.createElement("span"); status.className = "muted"; status.textContent = "Waiting...";
    var pre = document.createElement("pre"); pre.hidden = true;
    box.append(title, status, pre);
    $("out").appendChild(box);
    return { status: status, pre: pre };
  }

  async function readOne(file, ui) {
    var started = Date.now();
    var timer = setInterval(function () {
      ui.status.textContent = "Reading... " + ((Date.now() - started) / 1000).toFixed(0) + " s";
    }, 500);
    ui.status.textContent = "Sent, waiting for Gemini...";
    var form = new FormData();
    form.append("files", file);
    try {
      var res = await fetch("/api/handwriting/read-test/", { method: "POST", body: form });
      var secs = ((Date.now() - started) / 1000).toFixed(1);
      if (!res.ok) {
        ui.status.textContent = "Failed after " + secs + " s: " + await message(res);
        ui.status.className = "err";
        return;
      }
      var body = await res.json();
      ui.status.textContent = "Done in " + secs + " s";
      ui.pre.textContent = body.pages[0].text || "(nothing was read)";
      ui.pre.hidden = false;
    } catch (e) {
      ui.status.textContent = "Could not reach the server: " + e.message;
      ui.status.className = "err";
    } finally {
      clearInterval(timer);
    }
  }

  $("read").addEventListener("click", async function () {
    var files = $("files").files;
    if (!files.length) { show("Pick at least one file.", true); return; }
    $("out").innerHTML = "";
    $("read").disabled = true;
    show("Reading " + files.length + " file(s), one at a time.", false);
    var cards = Array.from(files).map(function (f) { return card(f.name); });
    for (var i = 0; i < files.length; i++) await readOne(files[i], cards[i]);
    show("All done.", false);
    $("read").disabled = false;
  });
</script>
</body>
</html>
